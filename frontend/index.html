<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="css/login.css">
<style>
  .portal-selector {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .portal-card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 25px 50px rgba(0,0,0,.25);
  }
  .portal-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .portal-logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #4F46E5, #7C3AED);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 16px;
    box-shadow: 0 8px 20px rgba(79,70,229,.35);
  }
  .portal-header h1 { font-size: 26px; font-weight: 800; color: #1E293B; margin-bottom: 4px; }
  .portal-header p  { color: #64748B; font-size: 14px; }
  .portal-tabs {
    display: flex;
    background: #F1F5F9;
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 28px;
  }
  .portal-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #64748B;
    transition: all .2s;
    border: none;
    background: none;
  }
  .portal-tab.active {
    background: #fff;
    color: #4F46E5;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .form-error { color: #EF4444; font-size: 12px; margin-top: 4px; display: none; }
  .form-error.show { display: block; }

  @media (max-width: 480px) {
    .portal-card {
      padding: 24px 16px;
      border-radius: 16px;
    }
    .portal-header h1 {
      font-size: 22px;
    }
    .portal-logo {
      width: 58px;
      height: 58px;
      font-size: 26px;
      border-radius: 16px;
      margin-bottom: 12px;
    }
    .portal-tabs {
      gap: 2px;
      padding: 3px;
    }
    .portal-tab {
      padding: 10px 6px;
      font-size: 13px;
      min-height: 42px;
    }
    .form-control {
      font-size: 16px !important;
    }
  }
</style>
</head>
<body>
<div class="portal-selector">
  <div class="portal-card">
    <div class="portal-header">
      <div class="portal-logo">🏫</div>
      <h1>EduManage Pro</h1>
      <p>Professional Student Management System</p>
    </div>

    <div class="portal-tabs">
      <button class="portal-tab active" onclick="switchTab('teacher', this)">👨‍🏫 Teacher Portal</button>
      <button class="portal-tab"        onclick="switchTab('student', this)">👨‍🎓 Student Portal</button>
    </div>

    <!-- ─── Teacher Login ─────────────────────────────── -->
    <div id="teacherTab" class="tab-content active">
      <div class="alert alert-error" id="teacherAlert"></div>
      <form id="teacherForm" onsubmit="teacherLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" class="form-control" id="teacherEmail"
              placeholder="admin@school.com" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-control" id="teacherPassword"
              placeholder="Enter password" required>
            <button type="button" class="toggle-pw" onclick="togglePw('teacherPassword', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="teacherLoginBtn">
          <div class="spinner-sm"></div>
          <span class="btn-text">Login as Teacher</span>
        </button>
      </form>
    </div>

    <!-- ─── Student Login ─────────────────────────────── -->
    <div id="studentTab" class="tab-content">
      <div class="alert alert-error" id="studentAlert"></div>
      <form id="studentForm" onsubmit="studentLogin(event)" novalidate>

        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <div class="input-wrap">
            <span class="input-icon">📱</span>
            <input type="tel" class="form-control" id="studentMobile"
              placeholder="Enter your mobile number"
              maxlength="10" inputmode="numeric" pattern="[6-9][0-9]{9}" required>
          </div>
          <div class="form-error" id="mobileErr">
            Enter a valid 10-digit mobile number starting with 6–9.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-control" id="studentPassword"
              placeholder="Enter password" required>
            <button type="button" class="toggle-pw" onclick="togglePw('studentPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="studentLoginBtn">
          <div class="spinner-sm"></div>
          <span class="btn-text">🎓 Login as Student</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      © 2026 EduManage Pro — Student Management System
    </div>
  </div>
</div>

<script src="js/api.js?v=12"></script>
<script src="js/auth.js?v=12"></script>
<script src="js/standard.js?v=12"></script>
<script>
  // Pre-warm server connection as soon as landing page loads
  fetch('/api/health').catch(() => {});

  const MOBILE_RE = /^[6-9]\d{9}$/;

  function switchTab(tab, btn) {
    document.querySelectorAll('.portal-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tab + 'Tab').classList.add('active');
  }

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁️'; }
  }

  // Allow only digits in mobile field
  document.getElementById('studentMobile').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 10);
  });

  function showAlert(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
  }

  async function teacherLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('teacherLoginBtn');
    btn.classList.add('loading'); btn.disabled = true;
    const { ok, data } = await Api.teacherLogin(
      document.getElementById('teacherEmail').value,
      document.getElementById('teacherPassword').value
    );
    btn.classList.remove('loading'); btn.disabled = false;
    if (ok) {
      Auth.saveTeacherSession(data.token, data.teacher);
      Standard.clear();
      window.location.href = '/teacher/select-standard.html';
    } else {
      showAlert('teacherAlert', data.error || 'Login failed.');
    }
  }

  async function studentLogin(e) {
    e.preventDefault();
    const mobile = document.getElementById('studentMobile').value.trim();
    const pw     = document.getElementById('studentPassword').value;
    const mobileErr = document.getElementById('mobileErr');

    // Client-side validation
    if (!MOBILE_RE.test(mobile)) {
      mobileErr.classList.add('show');
      document.getElementById('studentMobile').classList.add('error');
      return;
    }
    mobileErr.classList.remove('show');
    document.getElementById('studentMobile').classList.remove('error');

    const btn = document.getElementById('studentLoginBtn');
    btn.classList.add('loading'); btn.disabled = true;
    const { ok, data } = await Api.studentLogin(mobile, pw);
    btn.classList.remove('loading'); btn.disabled = false;

    if (ok) {
      Auth.saveStudentSession(data.token, data.student);
      window.location.href = '/student/dashboard.html';
    } else {
      showAlert('studentAlert', data.error || 'Login failed.');
    }
  }
</script>
</body>
</html>
