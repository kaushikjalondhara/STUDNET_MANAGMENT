<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Timetable — EduManage Pro</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<style>
  .tt-day-card {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .tt-day-header {
    background: linear-gradient(135deg, #4F46E5, #7C3AED);
    color: #fff;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 800;
  }
  .tt-table {
    width: 100%;
    border-collapse: collapse;
  }
  .tt-table th {
    background: #F8FAFC;
    padding: 10px 16px;
    font-size: 13px;
    text-align: left;
    color: #475569;
    border-bottom: 2px solid #E2E8F0;
  }
  .tt-table td {
    padding: 12px 16px;
    border-bottom: 1px solid #F1F5F9;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🏫</div>
      <div class="logo-text">
        <h2 class="school-name-text">Parth classic</h2>
        <span>Student Portal</span>
      </div>
      <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close Sidebar">✕</button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">My Portal</div>
      <a href="dashboard.html"     class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="profile.html"       class="nav-link"><span class="nav-icon">👤</span> My Profile</a>
      <a href="attendance.html"    class="nav-link"><span class="nav-icon">📅</span> My Attendance</a>
      <a href="result.html"        class="nav-link"><span class="nav-icon">📝</span> My Results</a>
      <a href="homework.html"      class="nav-link"><span class="nav-icon">📚</span> Homework</a>
      <a href="notes.html"         class="nav-link"><span class="nav-icon">📖</span> Study Notes</a>
      <a href="timetable.html"     class="nav-link active"><span class="nav-icon">📆</span> Timetable</a>
      <a href="fees.html"          class="nav-link"><span class="nav-icon">💰</span> Student Fees</a>
      <a href="notices.html"       class="nav-link"><span class="nav-icon">📢</span> Notices</a>
      <a href="notifications.html" class="nav-link"><span class="nav-icon">🔔</span> Notifications</a>
      <a href="leave.html"         class="nav-link"><span class="nav-icon">📨</span> Apply Leave</a>
      <a class="nav-link logout" onclick="Auth.logoutStudent()"><span class="nav-icon">🚪</span> Logout</a>
    </nav>
    <div class="sidebar-footer">
      <div class="teacher-info">
        <div class="teacher-avatar" id="studentInitial">S</div>
        <div>
          <div class="teacher-name" id="studentName">Student</div>
          <div class="teacher-role" id="stdBanner">—</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="header-left">
        <h1>My Class Timetable</h1>
        <div class="breadcrumb">Weekly schedule (Monday to Saturday)</div>
      </div>
    </header>

    <div class="page-content">
      <div id="timetableContainer">
        <div class="loading-overlay"><div class="spinner"></div></div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (Auth.requireStudent()) {
    Auth.populateStudentUI();
    loadStudentTimetable();
  }

  async function loadStudentTimetable() {
    const container = document.getElementById('timetableContainer');
    const { ok, data } = await Api.getTimetable();
    if (!ok) { Toast.error('Failed to load timetable.'); return; }

    const schedule = data.timetable?.schedule || {};
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    container.innerHTML = days.map(day => {
      const periods = schedule[day] || [];
      const rows = periods.map(p => `
        <tr>
          <td style="font-weight:700">Period ${p.period}</td>
          <td style="color:#4F46E5;font-weight:600">⏰ ${p.time}</td>
          <td><b>📖 ${p.subject}</b></td>
          <td><span class="badge badge-gray">${p.room || 'Classroom'}</span></td>
        </tr>
      `).join('');

      return `
        <div class="tt-day-card">
          <div class="tt-day-header">📅 ${day}</div>
          <div class="table-wrap">
            <table class="tt-table">
              <thead>
                <tr>
                  <th style="width:20%">Period</th>
                  <th style="width:30%">Time</th>
                  <th style="width:30%">Subject</th>
                  <th style="width:20%">Room / Lab</th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="4">No periods scheduled.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }).join('');
  }
</script>
</body>
</html>
