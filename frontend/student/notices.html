<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Notices — EduManage Pro</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🏫</div>
      <div class="logo-text">
        <h2 class="school-name-text">gyan jyot vidhaya bhavan</h2>
        <span>Student Portal</span>
      </div>
      <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close Sidebar">✕</button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">My Portal</div>
      <a href="dashboard.html"     class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="profile.html"       class="nav-link"><span class="nav-icon">👤</span> My Profile</a>
      <a href="attendance.html"    class="nav-link"><span class="nav-icon">📅</span> My Attendance</a>
      <a href="result.html"        class="nav-link"><span class="nav-icon">📝</span> My Results</a>
      <a href="homework.html"      class="nav-link"><span class="nav-icon">📚</span> Homework</a>
      <a href="notes.html"         class="nav-link"><span class="nav-icon">📖</span> Study Notes</a>
      <a href="timetable.html"     class="nav-link"><span class="nav-icon">📆</span> Timetable</a>
      <a href="fees.html"          class="nav-link"><span class="nav-icon">💰</span> Student Fees</a>
      <a href="notices.html"       class="nav-link active"><span class="nav-icon">📢</span> Notices</a>
      <a href="notifications.html" class="nav-link"><span class="nav-icon">🔔</span> Notifications</a>
      <a href="leave.html"         class="nav-link"><span class="nav-icon">📨</span> Apply Leave</a>
      <a class="nav-link logout" onclick="Auth.logoutStudent()"><span class="nav-icon">🚪</span> Logout</a>
    </nav>
    <div class="sidebar-footer">
      <div class="teacher-info">
        <div class="teacher-avatar" id="studentInitial">S</div>
        <div>
          <div class="teacher-name" id="studentName">Student</div>
          <div class="teacher-role" id="stdBanner">—</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="header-left">
        <h1>Notice Board</h1>
        <div class="breadcrumb">Official school announcements and class notices</div>
      </div>
    </header>

    <div class="page-content">
      <div id="studentNoticesContainer">
        <div class="loading-overlay"><div class="spinner"></div></div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (Auth.requireStudent()) {
    Auth.populateStudentUI();
    loadStudentNotices();
  }

  async function loadStudentNotices() {
    const container = document.getElementById('studentNoticesContainer');
    const { ok, data } = await Api.getNotices();
    if (!ok) { Toast.error('Failed to load notices.'); return; }

    const notices = data.notices || [];
    if (!notices.length) {
      container.innerHTML = '<div class="card"><div class="empty-state"><div class="empty-icon">📢</div><h3>No announcements posted currently</h3></div></div>';
      return;
    }

    container.innerHTML = notices.map(n => {
      const isUrgent = n.priority === 'Urgent';
      const isEvent = n.priority === 'Event';
      const badgeClass = isUrgent ? 'badge-danger' : (isEvent ? 'badge-info' : 'badge-success');
      const dateStr = n.created_at ? n.created_at.split('T')[0] : 'Recent';

      return `
        <div class="card" style="margin-bottom:16px;border-left:5px solid ${isUrgent ? '#DC2626' : '#4F46E5'}">
          <div class="card-body" style="padding:16px 14px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
              <div>
                <span class="badge ${badgeClass}" style="margin-right:8px">${n.priority}</span>
                <span class="badge badge-gray">${n.standard_label || 'All Standards'}</span>
                <h3 style="font-size:18px;font-weight:800;color:#1E293B;margin-top:8px;word-break:break-word">${n.title}</h3>
              </div>
            </div>
            <p style="color:#475569;font-size:14px;line-height:1.6;margin:10px 0;word-break:break-word">${n.description}</p>
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:#94A3B8;border-top:1px solid #F1F5F9;padding-top:10px">
              <span>👤 Posted by: <b>${n.posted_by}</b></span>
              <span>📅 Date: ${dateStr}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }
</script>
</body>
</html>
