<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — EduManage Pro</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">👨‍🎓</div>
      <h1>Student Login</h1>
      <p>Sign in with your mobile number and password</p>
    </div>

    <div class="alert alert-error" id="loginAlert"></div>

    <form id="loginForm" onsubmit="doLogin(event)" novalidate>

      <!-- Mobile Number -->
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <div class="input-wrap">
          <span class="input-icon">📱</span>
          <input
            type="tel"
            class="form-control"
            id="mobileNo"
            placeholder="Enter your mobile number"
            maxlength="10"
            required
            autofocus
            inputmode="numeric"
            pattern="[6-9][0-9]{9}"
          >
        </div>
        <div class="form-error" id="mobileError">
          Please enter a valid 10-digit mobile number starting with 6, 7, 8, or 9.
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-control" id="password"
            placeholder="Enter your password" required>
          <button type="button" class="toggle-pw" id="togglePwBtn" onclick="togglePw()">👁️</button>
        </div>
        <div class="form-error" id="pwError">Password is required.</div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <div class="spinner-sm"></div>
        <span class="btn-text">🎓 Login as Student</span>
      </button>
    </form>

    <div class="login-footer">
      <a href="/index.html" style="color:#64748B;text-decoration:none;">← Back to Home</a>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/standard.js"></script>
<script>
  // Pre-warm server connection as soon as login page opens
  fetch('/api/health').catch(() => {});

  // Remove any stale session so login form is always shown and required
  localStorage.removeItem('sms_token');
  localStorage.removeItem('sms_user');

  const MOBILE_RE = /^[6-9]\d{9}$/;

  function togglePw() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('togglePwBtn');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
  }

  function validateForm() {
    const mobile = document.getElementById('mobileNo').value.trim();
    const pw     = document.getElementById('password').value;
    let valid = true;

    const mobileErr = document.getElementById('mobileError');
    const pwErr     = document.getElementById('pwError');
    const mobileInp = document.getElementById('mobileNo');
    const pwInp     = document.getElementById('password');

    // Mobile validation
    if (!mobile || !MOBILE_RE.test(mobile)) {
      mobileErr.classList.add('show');
      mobileInp.classList.add('error');
      valid = false;
    } else {
      mobileErr.classList.remove('show');
      mobileInp.classList.remove('error');
    }

    // Password validation
    if (!pw) {
      pwErr.classList.add('show');
      pwInp.classList.add('error');
      valid = false;
    } else {
      pwErr.classList.remove('show');
      pwInp.classList.remove('error');
    }

    return valid;
  }

  // Only allow digits in mobile field
  document.getElementById('mobileNo').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 10);
  });

  async function doLogin(e) {
    e.preventDefault();
    const alert = document.getElementById('loginAlert');
    alert.classList.remove('show');

    if (!validateForm()) return;

    const mobile = document.getElementById('mobileNo').value.trim();
    const pw     = document.getElementById('password').value;

    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading'); btn.disabled = true;

    // Friendly feedback if backend instance is waking up
    const slowTimer = setTimeout(() => {
      if (btn.classList.contains('loading')) {
        btn.textContent = '⚡ Connecting to server…';
      }
    }, 2000);

    const { ok, data } = await Api.studentLogin(mobile, pw);

    clearTimeout(slowTimer);
    btn.classList.remove('loading'); btn.disabled = false;
    btn.textContent = 'Sign In as Student';

    if (ok) {
      Auth.saveStudentSession(data.token, data.student);
      window.location.href = '/student/dashboard.html';
    } else {
      alert.textContent = data.error || 'Invalid mobile number or password.';
      alert.classList.add('show');
    }
  }
</script>
</body>
</html>
